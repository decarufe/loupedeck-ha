name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Les fusions sur main passent une à la fois : deux runs simultanés calculeraient le même numéro de version.
# GitHub peut annuler un run en attente quand un plus récent arrive : sans conséquence, le plus récent contient
# ses commits. Les vérifications de PR ne sont pas concernées (un groupe par run).
concurrency:
  group: build-${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p . --noEmit
      - run: pnpm test
      - run: pnpm run build

  # Prochaine version : dernière étiquette publiée + 1. Pas github.run_number, que les vérifications de PR
  # incrémentent aussi (les versions sautaient de 2). Job à part : aucun checkout, jeton en lecture seule.
  version:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - id: next
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERIES: '0.2'
        run: |
          set -euo pipefail
          last=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v$SERIES." --jq '.[].ref' \
            | sed -nE 's#^refs/tags/v[0-9]+[.][0-9]+[.]([0-9]+)$#\1#p' | sort -n | tail -n 1)
          if [ -n "$last" ]; then
            # Relancer un ancien run ne doit pas republier du vieux code sous un numéro plus élevé.
            status=$(gh api "repos/$REPO/compare/v$SERIES.$last...$SHA" --jq .status)
            if [ "$status" != ahead ]; then
              echo "::notice::Commit déjà publié ou dépassé par v$SERIES.$last ($status) : aucune nouvelle version."
              exit 0
            fi
          fi
          version="$SERIES.$(( ${last:--1} + 1 ))"
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Fabrique l'installateur sans aucun droit d'écriture : le code des dépendances ne voit jamais de jeton
  # capable de publier.
  package:
    if: needs.version.outputs.version != ''
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Version écrite dans le paquet et dans latest.yml.
      # bash, pas PowerShell (shell par défaut sous Windows) : PowerShell coupe « -c.extraMetadata… »
      # en « -c » et « .extraMetadata… », et electron-builder prend alors « -c » pour un fichier de config.
      - run: pnpm exec electron-builder --win --publish never -c.extraMetadata.version="$VERSION"
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          if-no-files-found: error
          path: |
            release/LoupedeckHA-Setup-*.exe
            release/LoupedeckHA-Setup-*.exe.blockmap
            release/latest.yml

  # Publie la Release : aucun checkout, aucun code de dépendance, seulement les fichiers produits plus haut.
  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer
      # Échoue si l'étiquette existe déjà (publish relancé après une version plus récente) : rien n'est écrasé.
      - name: Publier la Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" installer/* --repo "$REPO" --target "$SHA" \
            --title "v$VERSION" --generate-notes
