name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p . --noEmit
      - run: pnpm test
      - run: pnpm run build

  # Fabrique l'installateur sans aucun droit d'écriture : le code des dépendances ne voit jamais de jeton
  # capable de publier.
  package:
    if: github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Version 0.2.<numéro du run>, écrite dans le paquet et dans latest.yml.
      - run: pnpm exec electron-builder --win --publish never -c.extraMetadata.version=0.2.${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          if-no-files-found: error
          path: |
            release/LoupedeckHA-Setup-*.exe
            release/LoupedeckHA-Setup-*.exe.blockmap
            release/latest.yml

  # Publie la Release : aucun checkout, aucun code de dépendance, seulement les fichiers produits plus haut.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Deux fusions rapprochées publient dans l'ordre, sans s'annuler.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer
      - run: >-
          gh release create "v0.2.${{ github.run_number }}" installer/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "v0.2.${{ github.run_number }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
